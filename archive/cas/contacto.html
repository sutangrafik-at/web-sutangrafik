<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACTO | Sutan Grafik</title>
  <meta name="description" content="Contacta con Sutan Grafik. Solicita presupuesto.">
  <link rel="canonical" href="https://sutangrafik.github.io/cas/contacto.html">
  <meta property="og:title" content="CONTACTO | Sutan Grafik">
  <meta property="og:image" content="../images/logo-hq.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <a href="#main-content" class="sr-only">Saltar al contenido</a>
  <header class="site-header" role="banner">
    <div class="header-left">
      <a href="index.html" class="logo-link" aria-label="Inicio"><img src="../images/logo-hq.png" alt="" class="logo-img" width="60" height="45"></a>
      <div class="lang-switch">
        <a href="../kontaktua.html" aria-label="Euskara">EUS</a>
        <a href="contacto.html" class="active" aria-label="Castellano">CAS</a>
      </div>
    </div>
    <nav class="main-nav" role="navigation">
      <a href="grafik.html">GRAFIK</a>
      <a href="bio.html">BIO</a>
      <a href="contacto.html" class="active">ContaCtO</a>
    </nav>
    <button class="hamburger" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main id="main-content">
    <section class="contact-section">
      <p class="page-label fade-in">contacto</p>
      <a href="mailto:sutangrafik@gmail.com" class="contact-email fade-in">sutangrafik@gmail.com</a>
      <h1 class="fade-in">¿NECESITAS UN PRESUPUESTO PARA TUS PROYECTOS?<br>PONTE EN CONTACTO CON NOSOTROS Y ACLARAREMOS DUDAS</h1>
      <form class="contact-form fade-in" id="contactForm" novalidate>
        <div class="form-group">
          <label for="name">Nombre</label>
          <input type="text" id="name" name="name" required aria-required="true" placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required aria-required="true" placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label for="message">Mensaje</label>
          <textarea id="message" name="message" required aria-required="true" placeholder="Escribe tu mensaje..."></textarea>
        </div>
        <button type="submit" class="submit-btn">Enviar</button>
        <div class="form-success" id="formSuccess" role="alert">¡Gracias! Mensaje enviado.</div>
      </form>
    </section>
    <section class="contact-cta">
      <div class="cta-links fade-in">
        <a href="bio.html" class="cta-btn">¿QUÉ ES SUTAN GRAFIK?</a>
        <a href="grafik.html" class="cta-btn">TRABAJOS REALIZADOS</a>
      </div>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <div class="footer-logo"><img src="../images/logo-hq.png" alt="" width="50" height="38" loading="lazy"></div>
      <nav class="footer-nav">
        <a href="grafik.html">GRAFIK</a>
        <a href="bio.html">BIO</a>
        <a href="contacto.html">ContaCtO</a>
      </nav>
      <div class="footer-social">
        <a href="https://www.facebook.com/sutan.grafik.3" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><img src="../images/facebook-icon-hq.png" alt="" width="16" height="16"></a>
        <a href="https://www.instagram.com/sutangrafikdiseinua/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img src="../images/instagram-icon-hq.png" alt="" width="16" height="16"></a>
      </div>
    </div>
    <div class="footer-bottom"><p>&copy; 2026 Sutan Grafik</p></div>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/animations.js"></script>
</body>
</html>
